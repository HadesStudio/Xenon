debug-mode: true # Do not edit the status of this via the config, use the debug mode command in game.

server:
  name: "Hub" # This is the name of the server this plugin is currently installed in.


# Advanced Client Version Data:
# This plugin will give you further information about your players.
# What client they are using, like lunar client, cosmic client, etc.
# This system can also detect some hacked clients!
advanced-client-version-data:
  enabled: true # Do you want to enable this system? NOTE: This system is always WIP.

  hacked-client: "&d[HAC]"
  cheat-breaker: "&7[&4C&bB&7]"
  cosmic-client: "&9[CC]"
  lunar-client: "&b[LC]"
  forge: "&6[F]"
  vanilla: "&a[V]"

chat-system:
  enabled: true # Do you want to use the built in chat system?
  warning-system: true # Do you want to use the blocked chat message warning system?

  mute-bypass-permission: "oxygen.chat.highrank"
  staff-bypass-permission: "oxygen.chat.bypass" # The permission that makes people exempt from chat punishments,etc.
  warning-amount: 5 # How many warnings are they given before a mute or ban?
  ban-command: "ban %player% 1d Spam -s"
  mute-command: "mute %player% 15m Spam -s"
  word-filters:
    - "puta"
    - "rata"
    - "mierda"
  link-whitelists: # These are links that ARE allowed to be put in chat.
    - "helydev.com"
    - "store.helydev.com"
  chat-format: "%tags% %rank_prefix% %player%%rank_suffix%&7: &f"


punishments:
  join:
    allow-banned: false
    allow-blacklisted: false
  default-reason: "Not Found"
  send-notifications:
    enabled: true # Do you want to send notifications using the notification system about punishments?
    ban-notification:
      - "&cYou received a ban!"
      - ""
      - "&cBanned By: &7%banner%"
      - "&cDuration: &7%duration%"
      - "&cServer: &7%server%"
    warning-notification:
      - "&cYou received a warning!"
      - ""
      - "&cBanned By: &7%banner%"
      - "&cDuration: &7%duration%"
      - "&cServer: &7%server%"
    mute-notification:
      - "&cYou received a warning!"
      - ""
      - "&cBanned By: &7%banner%"
      - "&cDuration: &7%duration%"
      - "&cServer: &7%server%"



statistics-settings:
  server-1:
    enabled: true # Do you want to enable statistics for this server?
    material-display: "DIAMOND_SWORD" # The material that is displayed for this server.
    display-name: "&6&lHCF" # The name of the server.
    use-hcf-core: true # This should ONLY be set to true if you are using a compatible HCF core on the server provided.
    inventory-slot: 0 # The slot that the item is displayed in.
  server-2:
    enabled: false # Do you want to enable statistics for this server?
    material-display: "BOW" # The material that is displayed for this server.
    display-name: "&4&lPractice" # The name of the server.
    use-hcf-core: false # This should ONLY be set to true if you are using a compatible HCF core on the server provided.
    inventory-slot: 1 # The slot that the item is displayed in.
  server-3:
    enabled: false # Do you want to enable statistics for this server?
    material-display: "GOLDEN_SWORD" # The material that is displayed for this server.
    display-name: "&c&lKitmap" # The name of the server.
    use-hcf-core: true # This should ONLY be set to true if you are using a compatible HCF core on the server provided.
    inventory-slot: 2 # The slot that the item is displayed in.
  server-4:
    enabled: false # Do you want to enable statistics for this server?
    material-display: "LAVA_BUCKET" # The material that is displayed for this server.
    display-name: "&3&lSurvival" # The name of the server.
    use-hcf-core: false # This should ONLY be set to true if you are using a compatible HCF core on the server provided.
    inventory-slot: 3 # The slot that the item is displayed in.
