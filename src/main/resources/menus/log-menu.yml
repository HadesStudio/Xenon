settings:
  # NOTE: They will still be logged in the database if set to false.
  save-to-file: true # Do you want to save files to a folder in your plugin folder?
  log-commands: true # Do you want to log anytime someone executes ANY command?
  log-joins: true # Do you want to log anytime a player joins or leaves?
messages:
  usage: "&cCorrect Usage: /logs <player>"
log-types:
  # WARNING: Do NOT put color codes.
  # If you put color codes, it will break your database..
  used-command: "Executed Command"
  op-player-command: "Gave Player OP"
  banned-player: "Banned a player"
  unbanned-player: "Unbanned a player"
  blacklisted-player: "Blacklisted a player"
