friends:
  friends-menu:
    title: "&d&lFriends"
    button:
      name: "&d%player_name%"
      lore: # %player%
        - "&dLeft-Click &7to remove this player from"
        - "&7your &dFriends List&7."
        - "&dRight-Click &7to view the players profile."
