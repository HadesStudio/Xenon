title: "%player% - Profile" # %player%
placeholders:
  style: "SPECIFIC" # Options: FILLED, SPECIFIC
  glowing: false
  specific-slots: [1, 2, 3, 7, 8, 9, 37, 45, 46, 47, 53, 54] # This will only work if you have the 'style' set to 'FILLED'.
size: 54 # This is how big the inventory is. This must be in increments of 9.

statistics-button:
  slot: 30
  title: "&4&lYour Statistics"
  material: "PAPER"
  data: 0
  lore: # %player%, %total_kills%, %total_deaths%
    - "&7This will view all your statistics across all servers."
    - ""
    - " &fGlobal Kills: &c%total_kills%"
    - " &fGlobal Deaths: &c%total_deaths%"
    - ""
    - "&7Click here to view extended information."

social-button:
  slot: 20
  title: "&4&lSocial Media"
  material: "PAINTING"
  data: 0
  lore: # %player%, %total_kills%, %total_deaths%
    - "&7Release your social media links to others."
    - ""
    - " &fSocials Linked: &c%total_linked%/5"
    - ""
    - "&7Click here to view extended information."

profile-button:
  slot: 13
  title: "&4&lYour Profile"
  material: "SKULL_ITEM" # If you want the players head to appear, use "SKULL_ITEM".
  data: 0
  lore: # %player%, %total_kills%, %total_deaths%
    - "&7View all of your useful information."
    - ""
    - " &fRank: &c%rank%"
    - " &fRank Duration: &c%rank_time%"
    - ""
    - "&7Click here to view extended information."

friends-button:
  slot: 24
  title: "&4&lFriends"
  material: "EYE_OF_ENDER"
  data: 0
  lore: # %player%, %total_kills%, %total_deaths%
    - "&7You can manage all of your friends using this."
    - ""
    - " &fFriends: &c%friends_size%"
    - " &fFriend Requests: &c%friend_requests_size%"
    - ""
    - "&dLeft-Click &7to view all your friends."
    - "&dRight-Click &7to view all friend requests."

notifications-button:
  slot: 32
  title: "&4&lNotifications"
  material: "WATCH"
  data: 0
  lore: # %player%, %total_kills%, %total_deaths%
    - "&7View all of your notifications."
    - ""
    - " &fUnread Notifications: &c%unread_size%"
    - ""
    - "&7Click here to view all notifications."

