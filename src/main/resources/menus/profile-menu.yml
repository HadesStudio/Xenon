    read-all:
      material: "NETHER_STAR"
      data: 0
      name: "&d&lRead All"
      lore: # %notification_size%
        - "&7Click here to mark all notifications"
        - "&7as &cread&7."
    notification:
      material: "PAPER"
      data: 0
      name: "&dNotification #%number% - %date%"
      read-line-lore: "&dLeft-Click &7to mark this notification as read."