messages:
  higher-priority: "&cYou cannot grant ranks to players who are a higher rank thank you.."
  applied:
    - ""
    - "&6[Grant] &aYou have just received a '&a&l%type%&a' grant!"
    - "&aYou have received this grant for: &a&l%time%"
    - ""
  expired:
    - ""
    - "&6[Grant] &cYou're '&c&l%type%&c' grant has just expired!"
    - ""
  prompts:
    duration:
      enter-duration:
        - "&7"
        - "&6[Grant] &aPlease type a valid duration for this grant in chat."
        - "&7"
      cancelled:
        - "&7"
        - "&6[Grant] &cYou have cancelled the process of giving a player a grant."
        - "&7"
      success:
        - "&7"
        - "&6[Grant] &aYou have successfully setup a duration for the grant. &7(1/3)"
        - "&7"
    permission:
      enter-permission:
        - "&7"
        - "&6[Grant] &aPlease type a valid permission for this grant in chat."
        - "&7"
      cancelled:
        - "&7"
        - "&6[Grant] &cYou have cancelled the process of giving a player a grant."
        - "&7"
    reason:
      enter-reason:
        - "&7"
        - "&6[Grant] &aPlease type a valid reason for giving this grant in chat."
        - "&7"
      cancelled:
        - "&7"
        - "&6[Grant] &cYou have cancelled the process of giving a player a grant."
        - "&7"
      added:
        - "&7"
        - "&6[Grant] &aYou have successfully given the player this grant!"
        - "&7"
    remove-reason:
      enter-reason:
        - "&7"
        - "&6[Grant] &aPlease type a valid duration for removing this grant in chat."
        - "&7"
      cancelled:
        - "&7"
        - "&6[Grant] &cYou have cancelled the process of removing a players grant."
        - "&7"
      removed:
        - "&7"
        - "&6[Grant] &aYou have successfully removed the players grant!"
        - "&7"
    server:
      enter-server:
        - "&7"
        - "&6[Grant] &aPlease type a valid server name to add for this grant."
        - "&7"
      cancelled:
        - "&7"
        - "&6[Grant] &cYou have cancelled the process of adding a server to this grant."
        - "&7"
      added:
        - "&7"
        - "&6[Grant] &aYou have successfully added the server '%server%' to this grant!"
        - "&7"

