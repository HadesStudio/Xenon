punishments:
  broadcast:
    blacklist:
      message: "%target% &awas blacklisted by &4%sender%&a."
      hover:
        enabled: true
        message:
          - "&eReason: &c%reason%"
    ban:
      message: "%target% &awas banned by &4%sender%&a."
      hover:
        enabled: true
        message:
          - "&eReason: &c%reason%"
          - "&eDuration: &cPermanent"
  kick:
    blacklist:
      - '&cYour account has been blacklisted from the %server_name% Network.'
      - '&cReason: %reason%'
      - '&cThis type of punishment cannot be appealed.'
    ban:
      - '&cYour account has been suspended from the %server_name% Network.'
      - '&cReason: %reason%'
      - '&cAppeal at %teamspeak%'
    temp-ban:
      - '&cYour account has been suspended from the %server_name% Network.'
      - '&cReason: %reason%'
      - '&cExpires in %expire%'
    kick:
      - '&cYou have been kicked by %sender%'
      - '&cReason: %reason%'




tag:
  usage:
    - "&7&l&m-----------------------------------"
    - "&d&lTag System Help"
    - "&7All commands and usages are listed below."
    - ""
    - "&d* &f/tag create <name> &7- Create a tag with specified name."
    - "&d* &f/tag remove <tag> &7- Delete a tag."
    - "&d* &f/tag setprefix <tag> <prefix> &7- ."
    - "&d* &f/tag setweight <tag> <weight> &7- ."
    - "&d* &f/tag import &7- ."
    - "&d* &f/tag export &7- ."
    - "&d* &f/tag list &7- View a list of all created tags."
    - "&7&l&m-----------------------------------"
  create:
    usage: "&cUsage: /tag create <name>"
    already-exist: "&cA tag with that name already exists."
    created: "&aTag '&f%tag_name%&a' &ahas been successfully created!"
  remove:
    usage: "&cUsage: /tag remove <name>"
    removed: "&cTag '&f%tag_name%&c' has been successfully removed!"
  setprefix:
    usage: "&cUsage: /tag setprefix <name> <prefix>"
    updated: "&aYou have updated the '&r%tag_name%&a' tag prefix to '&r%tag_prefix%&a'!"
  setweight:
    usage: "&cUsage: /tag setweight <name> <weight>"
    updated: "&aYou have updated the '&r%tag_name%&a' tag weight to '&r%tag_weight%&a'!"
  export:
    exported: "&aThe tags have been exported to tags.yml!"
  import:
    imported: "&aThe tags have been imported from tags.yml!"
  dont-exists: "&cA tag with that name doesn't exists."


