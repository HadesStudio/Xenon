blacklist:
  usage: "&cUsage: /blacklist <player> <reason> (&b-s&c) (&b-c&c)"
  already-blacklisted: "&cThat player has already been blacklisted."

un-blacklist:
  usage: "&cUsage: /unblacklist <player> <reason> (&b-s&c)"
  not-blacklisted: "&cThat player is not blacklisted."

ban:
  usage: "&cUsage: /ban <player> <reason> (&b-s&c) (&b-c&c)"
  already-banned: "&cThat player already has an active ban."

temp-ban:
  usage: "&cUsage: /tempban <player> <duration> <reason> (&b-s&c) (&b-c&c)"

un-ban:
  usage: "&cUsage: /unban <player> <reason> (&b-s&c)"
  not-banned: "&cThat player is not banned."

mute:
  usage: "&cUsage: /mute <player> [optional:duration] <reason> (&b-s&c)"
  already-muted: "&cThat player is already muted"

un-mute:
  usage: "&cUsage: /unmute <player> <reason> (&b-s&c)"
  not-muted: "&cThat player is not muted."

warn:
  usage: "&cUsage: /warn <player> [optional:duration] <reason> (&b-s&c)"

kick:
  usage: "&cUsage: /warn <player> <reason> (&b-s&c)"

tag:
  usage:
    - "&7&l&m-----------------------------------"
    - "&d&lTag System Help"
    - "&7All commands and usages are listed below."
    - ""
    - "&d* &f/tag create <name> &7- Create a tag with specified name."
    - "&d* &f/tag remove <tag> &7- Delete a tag."
    - "&d* &f/tag setprefix <tag> <prefix> &7- ."
    - "&d* &f/tag setweight <tag> <weight> &7- ."
    - "&d* &f/tag import &7- ."
    - "&d* &f/tag export &7- ."
    - "&d* &f/tag list &7- View a list of all created tags."
    - "&7&l&m-----------------------------------"
  create:
    usage: "&cUsage: /tag create <name>"
    already-exist: "&cA tag with that name already exists."
    created: "&aTag '&f%tag_name%&a' &ahas been successfully created!"
  remove:
    usage: "&cUsage: /tag remove <name>"
    removed: "&cTag '&f%tag_name%&c' has been successfully removed!"
  setprefix:
    usage: "&cUsage: /tag setprefix <name> <prefix>"
    updated: "&aYou have updated the '&r%tag_name%&a' tag prefix to '&r%tag_prefix%&a'!"
  setweight:
    usage: "&cUsage: /tag setweight <name> <weight>"
    updated: "&aYou have updated the '&r%tag_name%&a' tag weight to '&r%tag_weight%&a'!"
  export:
    exported: "&aThe tags have been exported to tags.yml!"
  import:
    imported: "&aThe tags have been imported from tags.yml!"
  dont-exists: "&cA tag with that name doesn't exists."


