debug-mode: true # Do not edit the status of this via the config, use the debug mode command in game.

server-name: "Hub"

command-system:
  disabled-commands:
    - "test"

name-mc:
  enabled: true # Do you want to enable the NameMC System?
  link: "https://api.namemc.com/server/helydev.com/likes?profile=" # Replace "helydev.com" with your server name.
  commands: # These are the commands executed when someone votes.
    - "rank give %player% Free"

chat-system:
  enabled: true
  default_slow: 5
  chat-format: "%tags% %rank_prefix% %player%%rank_suffix%&7: &f"

log:
  save-in-folder: true
  # WARNING: Do NOT put color codes.
  # If you put color codes, it will break your database..
  used-command: "Executed Command"
  op-player-command: "Gave Player OP"
  banned-player: "Banned a player"
  unbanned-player: "Unbanned a player"
  blacklisted-player: "Blacklisted a player"
  unblacklisted-player: "Unblacklisted a player"
  muted-player: "Muted a player"
  unmuted-player: "Unmuted a player"
  warned-player: "Warned a player"
  kicked-player: "Kicked a player"
  punishment-given: "Received a punishment"
  punishment-remove: "Punishment was removed"
  joined-server: "Connected to server"
  leave-server: "Disconnected from server"
  grant-given: "Received a rank grant"
  grant-removed: "Rank grant removed"
  given-rank: "Gave someone a rank"
  received-currency: "Received ingame currency"
  currency-removed: "Ingame currency was taken"
  staff-currency-update: "Updated a players currency"


profile:
  default-currency: 0
  send-notifications:
    add-currency:
      - "&7While you where offline, you where"
      - "&7given in-game currency!"
      - "&7In-game currency can be used in &6/shop&c."
      - "&7"
      - "&6Amount: &c%amount%"
    remove-currency:
      - "&7While you where offline, currency"
      - "&7was removed from your proflie!"
      - "&f"
      - "&6Amount: &c%amount%"


punishments:
  safety:
    cannot-punish: "&cYou cannot punish a player with a higher rank weight than you."
  join:
    allow-banned: false
    allow-blacklisted: false
  default-reason: "Not Found"
  send-notifications:
    enabled: true
    ban-notification:
      - "&7You received a ban!"
      - ""
      - "&6Reason: &c%reason%"
      - "&6Duration: &c%duration%"
      - "&6Server: &c%server%"
    warning-notification:
      - "&7You received a warning!"
      - ""
      - "&6Reason: &c%reason%"
      - "&6Duration: &c%duration%"
      - "&6Server: &c%server%"
    mute-notification:
      - "&7You received a warning!"
      - ""
      - "&6Reason: &c%reason%"
      - "&6Duration: &c%duration%"
      - "&6Server: &c%server%"

