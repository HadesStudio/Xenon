commands:
  usage:
    - "&7&l&m-----------------------------------"
    - "&6&lRank System Help"
    - "&7All commands and usages are listed below."
    - ""
    - "&7* &f/rank create <name> &7- &fCreate a rank with specified name."
    - "&7* &f/rank delete <name> &7- &fDelete a rank."
    - "&7* &f/rank info <name> &7- &fView all info from a rank."
    - "&7* &f/rank rename <rank> <new_name> &7- &fRename a existing rank to a new name."
    - "&7* &f/rank list &7- &fView a list of all created ranks."
    - "&7* &f/rank inherit <add|list|remove> <rank> <inheritance> &7- &fModify inheritances for a rank."
    - "&7* &f/rank perms <add|list|remove> <rank> <permission> &7- &fModify a ranks permissions."
    - "&7* &f/rank bungeeperms <add|list|remove> <rank> <permission> &7- &fModify a ranks bungee permissions."
    - "&7* &f/rank setprefix <name> <prefix> &7- &fUpdates a prefix for a rank."
    - "&7* &f/rank setsuffix <name> <suffix> &7- &fUpdates a suffix for a rank."
    - "&7* &f/rank setweight <name> <weight> &7- &fUpdates the rank weight of a rank."
    - "&7* &f/rank setcolor <name> <color> &7- &fChanges the color of a rank."
    - "&7* &f/rank settype <name> <type> &7- &fUpdates the rank type of a rank."
    - "&7* &f/rank promote <player> <reason> &7- &fPromotes a user up +1 rank."
    - "&7* &f/rank demote <player> <reason> &7- &fDemotes a user down -1 rank."
    - "&7* &f/rank import &7- &fImport all ranks from ranks.yml"
    - "&7* &f/rank export &7- &fExport all ranks to ranks.yml"
    - "&7&l&m-----------------------------------"
  create:
    usage: "&cCorrect Usage: /rank create <name>"
    already-exist: "&cSorry, a rank with the name specified already exists."
    created: "&aYou have successfully created a rank named '&d%rank_name%&a'."
  delete:
    usage: "&cCorrect Usage: /rank delete <name>"
    deleted: "&aYou have successfully deleted a rank named '&d%rank_name%&a'."
  rename:
    usage: "&cCorrect Usage: /rank rename <rank> <new_name>"
    renamed: "&aYou have successfully changed the name of &6%rank% Rank &ato &6%new_name%&a."
  color:
    usage: "&cCorrect Usage: /rank setcolor <rank> <color>"
    color-changed: "&aYou have successfully changed the color of &6%rank% Rank &ato &6%color%&a."
    not-exist: "&cThe rank by this name does not exist, please try again."
    invalid-color: "&cYou have specified a invalid color.. Please try again."
  demote:
    usage: "&cCorrect Usage: /rank demote <player> <reason>"
    invalid-rank: "&cYou cannot demote this person anymore ranks. Make sure that the weights are +1 from each other."
    cannot-give: "&cSorry, you can only demote ranks that are below the rank of &6%rank%&c."
    demoted: "&6You have successfully demoted &6&l%player% &6to the rank of &6&l%name%&6."
  promote:
    usage: "&cCorrect Usage: /rank promote <player> <reason>"
    invalid-rank: "&cYou cannot promote this person anymore ranks. Make sure that the weights are +1 from each other."
    cannot-give: "&cSorry, you can only promote ranks that are below the rank of &6%rank%&c."
    promoted: "&6You have successfully promoted &6&l%player% &6to the rank of &6&l%name%&6."

  import:
    imported: "&aYou have successfully imported all ranks from &7ranks.yml&a."
  export:
    exported: "&aYou have successfully exported all ranks to &7ranks.yml&a."
  inherit:
    usage: "&cCorrect Usage: /rank inherit <add|list|remove> <rank> <inheritance>"
    already-inherit: "&cThis rank already inherits that rank."
    no-inherits: "&cThis rank does not have any inheritances."
    added-inherit: "&aYou have successfully added the inheritance of &l%inhterit_rank_name% &ato &l%rank_name%&a."
    list-format: "&6* &a%rank% Rank"
    removed-inherit: "&cYou have removed the rank inheritance for this rank."
    not-have: "&cThis rank does not have that inheritancce?"
  setprefix:
    usage: "&cCorrect Usage: /rank setprefix <rank> <display>"
    set: "&aYou have updated this ranks prefix to: &l%prefix%"
  setsuffix:
    usage: "&cCorrect Usage: /rank setsuffix <rank> <display>"
    set: "&aYou have updated this ranks suffix to: &l%suffix%"
  setweight:
    usage: "&cCorrect usage: /rank setweight <rank> <weight>"
    set: "&aYou have updated this ranks weight to: &l%weight%"
  setqueuepriority:
    usage: "&cCorrect Usage: /rank setqueuepriority <rank> <priority>"
    set: "&aYou have updated this ranks queue priority to: &l%priority%"
  settype:
    usage: "&cCorrect usage: /rank settype <rank> <type>"
    set: "&aYou have updated this ranks type to: &l%type%"
  info:
    usage: "&cCorrect usage: /rank info <rank>"
    message:
      - "&7&l&m---------------------------------"
      - "&6%rank% Rank:"
      - "&7This rank has the following configurations."
      - ""
      - "&6Type: &f%type%"
      - "&6Prefix: &f%prefix%"
      - "&6Suffix: &f%suffix%"
      - "&6Weight: &f%weight%"
      - "&6Permissions: &f%perms% Permissions"
      - "&6Inheritances: &f%inherits% Inheritances"
      - "&7&l&m---------------------------------"
  bungee-permissions:
    usage: "&cCorrect Usage: /rank bungeepermissions <add|list|remove> <rank> <permission>"
    already-has: "&cThis rank already has this &6Bungee Permission&c."
    added: "&cYou have successfully added permission: &6%permission%"
    no-permissions: "&cThis rank has no bungee permissions setup."
    list-format: "&6* &a%permission% &f- Bungee"
    removed: "&cYou have successfully removed this &6Bungee Permission&c."
    not-have: "&cThis rank does not have that permission?"
  permissions:
    usage: "&cCorrect Usage: /rank permissions <add|list|remove> <rank> <permission>"
    already-has: "&cThis rank already has this &6Permission&c."
    added: "&cYou have successfully added permission: &6%permission%"
    no-permissions: "&cThis rank has no permissions setup."
    list-format: "&6* &a%permission% &f- Local"
    removed: "&cYou have successfully removed this &6Permission&c."
    not-have: "&cThis rank does not have that permission?"
  dont-exists: "&cA rank with that name doesn't exists."


