menu:
  settings:
    command-name: "vip" # The name of the command in-game to open the menu, I added this if you want to rename it.
    grant-name: "vip" # This is the name of the rank they must have to have the "VIP Status".
    queue-priority-amount: 1 # The amount of queue priority they are given.
    vip-icon: "✪" # This is the icon that will be displayed.
    day-cooldown: 7 # This is how long the cooldown delay is in DAYS.
  messages:
    cooldown: "&6[Xenon] &7You can claim you're rewards again in &c%time%&7."
    no-rewards: "&6[Xenon] &7Sorry, the &6VIP Rank &7does not have any rewards right now! Please try again later."
    updated-color: "&6[Xenon] &7You have updated your &6VIP Icon&7! It will now look like '&c%example%&7'."
    no-vip-status: "&6[Xenon] &7Sorry, you do not have a &6VIP Status&7! You can purchase &6VIP Status &7from our store!"
    broadcast:
      - "&7&l&m-------------------------------------------"
      - "&6%player% &7has just reclaimed their &6VIP Rewards&7!"
      - "&7You can purchase &6VIP Status &7from our store!"
      - "&6&nascendproyect.org/store"
      - "&7&l&m-------------------------------------------"
  size: 3 # The number is automatically multiplied by 9.
  title: "VIP Status"
  buttons:
    rewards-button:
      slot: 10
      material: "TRIPWIRE_HOOK"
      data: 0
      use-skull: true # Set this to TRUE if you are using the player skull and want the players head to appear.
      display-name: "&6Claim Rewards"
      lore:
        - "&7Below, is all you're rewards that"
        - "&7can be claimed."
        - "&7"
        - "&6Rewards&7: &b%amount% Rewards"
        - "&6Claimable In&7: &b%time%"
        - "&7"
        - "&6Left-Click &7to claim rewards"
        - "&6Right-Click &7to view rewards."
    status-button:
      slot: 13
      material: "SKULL_ITEM"
      data: 3
      use-skull: true # Set this to TRUE if you are using the player skull and want the players head to appear.
      display-name: "&6VIP Status Information"
      lore:
        - "&7This is all information about"
        - "&7your &6VIP Status&7!"
        - "&7"
        - "&6VIP Status&7: &c%status%"
        - "&6Time Left&7: &c%remaining%"
        - "&7"
        - "&7&oYou can renew your &6&oVIP Status &7&oby"
        - "&7&ovisiting our store!"
        - "&6&oascendproyect.org/store"
    color-button:
      slot: 16
      selected-color-data: true # Do you want to set hte ink sac to match the color of the player's VIP status?
      material: "WOOL"
      display-name: "&6Icon Color"
      lore:
        - "&7Click here to change the color"
        - "&7of your &6VIP Icon Color&7!"
        - "&7"
        - "&6Current Color&7: &c%color%"

color-menu:
  title: "Select VIP Color"

rewards-menu:
  title: "VIP Rewards"

rewards:
  64-diamond-blocks:
    name: "&b64x Diamond Blocks"
    material: "DIAMOND_BLOCK"
    data: 0
    lore:
      - "&7&l&m-------------------------------"
      - "&bYou will receive &b&l64x Diamond Block&b!"
      - "&7&l&m-------------------------------"
    commands:
      - "give %player% 64 Diamond_Block"