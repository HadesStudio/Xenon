selector:
  title: "&8%player_name% - History" # %player_name%
  size: 3 # NOTE: It is automatically multiplied by 9.
  blacklist:
    slot: 9 # The slot the item is in the menu.
    name: "&6Blacklists &7(&a%blacklist_size%&7)"
    material: "WOOL"
    data: 1
    lore: # %status%
      - "&7Click here to view all previous and"
      - "&7current blacklists."
      - ""
      - "&6Currently Blacklisted: &7%status%"
    settings:
      permission:
        enabled: true # Do you want staff to require a specific permission to access blacklists?
        permission: "oxygen.history.blacklists" # The permission required to view blacklists, only if set to true.
        message: "&cYou do not have permissions to view &6Blacklists&c."
  bans:
    slot: 11 # The slot the item is in the menu.
    name: "&6Bans &7(&a%ban_size%&7)"
    material: "WOOL"
    data: 2
    lore: # %status%
      - "&7Click here to view all previous and"
      - "&7current bans."
      - ""
      - "&6Currently Banned: &7%status%"
    settings:
      permission:
        enabled: true # Do you want staff to require a specific permission to access bans?
        permission: "oxygen.history.bans" # The permission required to view bans, only if set to true.
        message: "&cYou do not have permissions to view &6Bans&c."
  kicks:
    slot: 13 # The slot the item is in the menu.
    name: "&6Kicks &7(&a%kick_size%&7)"
    material: "WOOL"
    data: 3
    lore: # %status%
      - "&7Click here to view all previous kicks."
    settings:
      permission:
        enabled: true # Do you want staff to require a specific permission to access kicks?
        permission: "oxygen.history.kicks" # The permission required to view kicks, only if set to true.
        message: "&cYou do not have permissions to view &6Kicks&c."
  mutes:
    slot: 15 # The slot the item is in the menu.
    name: "&6Mutes &7(&a%mute_size%&7)"
    material: "WOOL"
    data: 4
    lore: # %status%
      - "&7Click here to view all previous and"
      - "&7current mutes."
      - ""
      - "&6Currently Muted: &7%status%"
    settings:
      permission:
        enabled: true # Do you want staff to require a specific permission to access mutes?
        permission: "oxygen.history.mutes" # The permission required to view mutes, only if set to true.
        message: "&cYou do not have permissions to view &6Mutes&c."
  warns:
    slot: 17 # The slot the item is in the menu.
    name: "&6Warnings &7(&a%warning_size%&7)"
    material: "WOOL"
    data: 5
    lore: # %status%
      - "&7Click here to view all warnings."
    settings:
      permission:
        enabled: true # Do you want staff to require a specific permission to access kicks?
        permission: "oxygen.history.kicks" # The permission required to view kicks, only if set to true.
        message: "&cYou do not have permissions to view &dKicks&c."
