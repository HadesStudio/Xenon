settings:
  system-name: # Below, are a few options so you have the ability to rename this sytem to whatever you like.
    name: "Squads" # This is the main name for this system.
    command-name: "squad" # This is the MAIN command for this system.
    aliases: # These are commands that will also work to make the command execute.
      - "squads"
  squad-limit: 12 # This is the maximum amount of people that can be in a squad.
  broadcast-format: "&6[Squad] &e(%server%) &a%player%&7: &f%message%"

commands:
  no-permission: "&cYou cannot use this feature because you are not in this squad."
  already-in-squad: "&cYou are already in a squad."
  not-in-squad: "&cYou are currently not in a squad."
  help:
    usage:
      - ""
  create:
    usage: "&cCorrect Usage: /squad create <name>"
    invalid-name: "&cYour squad name must have more than 2 characters."
    only-characters: "&cYou can only use letters in your squad name."
    too-long: "&cThe squad name you specified is to long, it must be less than 8 characters.."
    already-exist: "&cA squad with this name already exists, try a different name."
    created: "&6[Squad] &aYou have successfully created a new squad!"
  leave:
    leader: "&cYou must disband this squad, because you are the leader."
    broadcast: "&6[Squad] &c%player%&7 has just left the squad!"
    send: "&6[Squad] &7You have successfully left your squad."
  join:
    usage: "&cCorrect Usage: /squad join <player|squad>"
    not-invited: "&cYou have not been invited to a squad with this name or a member with this name."
    password: "&cYou need a invitation or a password to join this squad."
    invalid-password: "&cYou have provided a invalid password to join this squad."
    broadcast: "&6[Squad] &a%player% &7has just joined the squad!"
    joined: "&6[Squad] &7You have successfully joined this squad."
  chat:
    enabled: "&6[Squad] &aYou are now speaking in squad chat."
    disabled: "&6[Squad] &cYou are no longer speaking in squad chat."
  disband:
    not-leader: "&cYou are not the leader of this squad."
    disbanded: "&6[Squad] &7You have successfully disbanded your squad!"
    broadcast: "&6[Squad] &7Your squad has just been &cdisbanded&7!"
  invite:
    usage: "&cCorrect Usage: /squad invite <player>"
    limit: "&cYou're squad has reached the squad limit, please kick someone before inviting them."
    not-captain: "&cYou must be a captain or squad leader to invite someone."
    self: "&cYou cannot invite yourself to your squad."
    already-in: "&c&l%player% &cis already a member of your squad."
    has-squad: "&cThat player already has a squad."
    already-invite: "&c&l%player% &chas already been invited to the squad within the last 60 seconds."
    broadcast: "&6[Squad] &c%player% &7has just been invited to the squad!"
    invited: "&6[Squad] &7You have invited &c%player% &7to your squad!"
    invite: "&6[Squad] &7You have just been invited to the '&6%squad%&7' squad. Type '&6/squad join %squad%&7' to join the squad."
  kick:
    usage: "&cCorrect Usage: /squad kick <player>"
    not-captain: "&cYou must be a captain or squad leader to kick someone."
    kick-self: "&cYou cannot kick yourself from the faction.."
    not-in: "&cThe player name you have specified is not in your squad.."
    kick-members: "&cYou can only kick squad members.."
    kicked: "&6[Squad] &7You have just been kicked from your squad!"
    broadcast: "&6[Squad] &c%player% &7has just been kicked from the squad!"
  password:
    usage: "&cCorrect Usage: /squad password <password|none>"
    not-leader: "&cYou are not the squad leader of this squad.."
    setup: "&6[Squad] &7You have set your squad password to '&a%password&7'."
  promote:
    usage: "&cCorrect Usage: /squad promote <player>"
    not-leader: "&cYou do not have permission to promote people."
    promote-self: "&cYou cannot promote yourself.."
    not-in: "&cThe player name you have specified is not in your squad.."
    already-captain: "&cThis player is already a captain in your squad.."
    promote: "&6[Squad] &7You have successfully promoted this player to &6Captain&7!"
    broadcast: "&6[Squad] &a%player% &7has just been promoted to &6Captain&7!"
  demote:
    usage: "&cCorrect Usage: /squad demote <player>"
    not-leader: "&cYou do not have permission to demote people."
    not-captain: "&cThis player is already the lowest rank in your squad.."
    not-in: "&cThe player name you have specified is not in your squad.."
    demote-self: "&cYou cannot demote yourself.."
  open:
    not-leader: "&cSorry, only the squad leader can open or close the squad."
    enabled: "&6[Squad] &aAll players can now join your squad!"
    disabled: "&6[Squad] &cPlayers can now no longer join your squad without a invite or the password."

menus:
  main-menu:
    title: "Your Squad (%online%/%offline%)"
    size: 5 # Automatically multiplied by 9.
    buttons:
      create-squad:
        material: "NAME_TAG"
        data: 0
        display-name: "&6Create Squad"
        lore:
          - "&7Click here to create a squad."
        slot: 21
        messages:
          type-name:
            - "&7"
            - "&6[Squad] &7Please type the name of your squad you wish to create. You can type '&ccancel&7' to cancel this."
            - "&7"
          cancelled:
            - "&7"
            - "&6[Squad] &7You have cancelled the process of creating a new squad."
            - "&7"
          invalid-squad: "&6[Squad] &7Sorry, their is already a squad with this name. Please try a different name."
      squad-invites:
        material: "SIGN"
        data: 0
        display-name: "&6Squad Invites"
        lore:
          - "&7Click here to see all your squad"
          - "&7invites."
        slot: 22
      find-squad:
        material: "BOOK"
        data: 0
        display-name: "&6Search for Squad"
        lore:
          - "&7Click here to search for a squad"
          - "&7by username."
        slot: 23
        messages:
          type-name:
            - "&7"
            - "&6[Squad] &7Please type the name of the squad you wish to view. You can type '&ccancel&7' to cancel this."
            - "&7"
          cancelled:
            - "&7"
            - "&6[Squad] &7You have cancelled the process of viewing a squad."
            - "&7"
          invalid-squad: "&6[Squad] &7You have provided a invalid squad name. Please try again."
  info-menu:
    title: "%squad% Info (%online%/%members%)"
    buttons:
      member-button:
        display-name: "&6%member_name% &7(%rank%)"
        lore:
          member:
            - "&7Click here to view more information."
          no-access:
            - "&7You are not a squad member."
      squad-info:
        material: "NETHER_STAR"
        data: 0
        display-name: "&6Squad Information"
        lore:
          - "&6Name&7: &c%squad_name%"
          - "&6Leader&7: &c%leader%"
          - "&6Members&7: &c%members%"
          - "&6Date Created&7: &c%date%"
      squad-discord:
        material: "PAINTING"
        data: 0
        display-name:
          in-squad: "&6Your Squad's Discord"
          visitor: "&6Squad Discord"
        lore:
          in-squad:
            - "&6Link&7: &b%link%"
            - "&7"
            - "&6Left-Click &7to edit the discord link."
            - "&6Right-Click &7to reset your discord link."
          visitor:
            - "&6Link&7: &b%link%"
        messages:
          type-name:
            - "&7"
            - "&6[Squad] &7Please type the link of your discord server. You can type '&ccancel&7' to cancel this."
            - "&cNOTE: &7You're link must contain '&adiscord.gg/&7'."
            - "&7"
          cancelled:
            - "&7"
            - "&6[Squad] &7You have cancelled the process of setting up the discord link."
            - "&7"
          invalid-link: "&cYou have specified a invalid discord link. Please try again."
          reset: "&6[Squad] &cYou have successfully reset your discord link."
          setup: "&6[Squad] &7You have updated your squad's discord link to: &6%link%"
      squad-join: # This replaces the "squad invite" button whenever you are viewing another group.
        material: "INK_SAC"
        data: 5
        display-name: "&6Join Squad"
        lore:
          - "&7Click here to attempt to join this"
          - "&7squad!"
          - "&7"
          - "&6Invited&7: &a%invited%"
          - "&6Password Protected&7: &a%password%"
          - "&6Open&7: &a%open%"
        messages:
          type-name:
            - "&7"
            - "&6[Squad] &7Please type the password for this squad in chat. You can type '&ccancel&7' to cancel this."
            - "&7"
          cancelled:
            - "&7"
            - "&6[Squad] &7You have cancelled the process of joining this squad."
            - "&7"
          invalid-password: "&6[Squad] &cYou have specified a invalid password.."
      squad-invite:
        material: "BOOK_AND_QUILL"
        data: 0
        display-name: "&6Invite Squad Member"
        lore:
          - "&7Click here to invite a member to"
          - "&7this squad!"
        messages:
          type-name:
            - "&7"
            - "&6[Squad] &7Please type the name of the player you wish to invite to the squad. You can type '&ccancel&7' to cancel this."
            - "&7"
          cancelled:
            - "&7"
            - "&6[Squad] &7You have cancelled the process of inviting someone to the squad."
            - "&7"
  member-editor:
    title: "%member% (%role%)"
    size: 3 # Automatically multiplied by 9.
    buttons:
      kick-member:
        material: "IRON_FENCE"
        data: 0
        display-name: "&cKick Member"
        lore:
          - "&7Click here to kick this member."
        slot: 11
      promote-member:
        material: "NETHER_STAR"
        data: 0
        display-name: "&aPromote to %new_rank%"
        lore:
          - "&7Click here to promote this member."
        slot: 13
      demote-member:
        material: "REDSTONE"
        data: 0
        display-name: "&cDemote to %new_rank%"
        lore:
          - "&7Click here to demote this member."
        slot: 15
      back-button:
        slot: 0
    messages:
      not-leader: "&cYou must be the leader to access this feature."